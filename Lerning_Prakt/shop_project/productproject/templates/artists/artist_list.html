<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исполнители — VINYL</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #e0e0e0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header { 
            background: #000; 
            padding: 20px 0; 
            text-align: center; 
            border-bottom: 1px solid #333; 
        }

        nav a { 
            color: #fff; 
            margin: 0 18px; 
            text-decoration: none; 
            font-size: 1.05rem;
        }

        nav a:hover { 
            color: #aaa; 
        }

        h1 { 
            text-align: center; 
            margin: 50px 0 30px; 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
            /* flex: 1 — УБРАЛ, чтобы контент не растягивался */
        }

        .card { 
            background: #1a1a1a; 
            border-radius: 8px; 
            overflow: hidden; 
            text-align: center; 
            padding: 15px; 
        }

        .card img { 
            width: 180px; 
            height: 180px; 
            object-fit: cover; 
            border-radius: 50%; 
        }

        footer {
            background: #0a0a0a;
            color: #666;
            text-align: center;
            padding: 16px 0;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: auto; /* Прижимает футер к низу */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'productproject:home' %}">Главная</a>
            <a href="{% url 'productproject:about' %}">О компании</a>
            <a href="{% url 'productproject:plate_list' %}">Товары</a>
            <a href="{% url 'productproject:artist_list' %}">Исполнители</a>
            <a href="{% url 'productproject:cart' %}">Корзина</a>
        </nav>
    </header>

    <h1>Исполнители</h1>
    
    <div class="grid">
        {% for artist in artists %}
        <div class="card">
            {% if artist.photo %}
                <img src="{{ artist.photo.url }}" alt="{{ artist.name }}">
            {% endif %}
            <h3>{{ artist.name }}</h3>
            <p style="margin: 10px 0; color: #aaa;">{{ artist.country|default:"—" }}</p>
            <a href="{% url 'productproject:artist_detail' artist.pk %}">Подробнее →</a>
        </div>
        {% empty %}
            <p style="grid-column: 1 / -1; text-align: center; padding: 50px; color: #777;">
                Пока нет исполнителей
            </p>
        {% endfor %}
    </div>

    <footer>
        © 2026 VINYL STORE — Все права защищены
    </footer>
</body>
</html>
