<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог пластинок</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            height: 100%;
        }
        
        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #e0e0e0; 
            display: flex;
            flex-direction: column;
        }
        
        header { 
            background: #000; 
            padding: 20px 0; 
            text-align: center; 
            border-bottom: 1px solid #333; 
            flex-shrink: 0; /* Запрещаем сжатие */
        }
        
        nav a { 
            color: #fff; 
            margin: 0 20px; 
            text-decoration: none; 
        }
        
        h1 { 
            text-align: center; 
            margin: 40px 0; 
            font-size: 2.5rem; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        
        .card { 
            background: #1a1a1a; 
            border-radius: 8px; 
            overflow: hidden; 
            transition: 0.3s; 
        }
        
        .card:hover { 
            transform: translateY(-10px); 
        }
        
        .card img { 
            width: 100%; 
            height: 240px; 
            object-fit: cover; 
        }
        
        .card-body { 
            padding: 15px; 
        }
        
        .card-body h3 { 
            margin-bottom: 8px; 
        }
        
        .price { 
            font-weight: bold; 
            color: #fff; 
            font-size: 1.2rem; 
            margin: 10px 0;
        }
        
        .card-body a { 
            color: #e0e0e0; 
            text-decoration: none; 
            display: inline-block;
            margin-top: 10px;
        }
        
        .card-body a:hover { 
            text-decoration: underline; 
        }
        
        /* Основной контент */
        main {
            flex: 0 0 auto; /* Не растягивается */
        }
        
        footer {
            background: #0a0a0a;
            color: #666;
            text-align: center;
            padding: 14px 0;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: auto; /* Прижимает футер к низу */
            flex-shrink: 0; /* Запрещаем сжатие */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'productproject:home' %}">Главная</a>
            <a href="{% url 'productproject:about' %}">О компании</a>
            <a href="{% url 'productproject:plate_list' %}">Товары</a>
            <a href="{% url 'productproject:artist_list' %}">Исполнители</a>
            <a href="{% url 'productproject:cart' %}">Корзина</a>
        </nav>
    </header>

    <main>
        <h1>Все пластинки</h1>
        <div class="grid">
            {% for plate in plates %}
            <div class="card">
                {% if plate.photo %}
                    <img src="{{ plate.photo.url }}" alt="{{ plate.name }}">
                {% endif %}
                <div class="card-body">
                    <h3>{{ plate.name }}</h3>
                    <p class="price">{{ plate.price }} ₽</p>
                    <a href="{% url 'productproject:plate_detail' plate.pk %}">Подробнее →</a>
                </div>
            </div>
            {% empty %}
            <div class="card" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <p>Пластинок пока нет</p>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer>
        © 2026 VINYL STORE — Все права защищены
    </footer>
</body>
</html>
