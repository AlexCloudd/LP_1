<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINYL — Главная</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #e0e0e0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header { 
            background: #000; 
            padding: 18px 0; 
            text-align: center; 
            border-bottom: 1px solid #333; 
        }

        nav a { 
            color: #fff; 
            margin: 0 18px; 
            text-decoration: none; 
            font-size: 1.05rem; 
        }

        nav a:hover { 
            color: #aaa; 
        }

        .hero { 
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;   /* Вертикальное выравнивание по центру */
            align-items: center;       /* Горизонтальное выравнивание по центру */
            text-align: center;
            padding: 20px;
        }

        .hero h1 { 
            font-size: 3.4rem; 
            letter-spacing: 4px; 
            margin-bottom: 16px; 
        }

        .hero p { 
            font-size: 1.3rem; 
            color: #aaa; 
            margin-bottom: 35px; 
            max-width: 600px;
        }

        .btn { 
            background: #fff; 
            color: #000; 
            padding: 14px 34px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 4px; 
            font-size: 1.1rem;
        }

        .btn:hover { 
            background: #ddd; 
        }

        footer {
            background: #0a0a0a;
            color: #666;
            text-align: center;
            padding: 14px 0;
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'productproject:home' %}">Главная</a>
            <a href="{% url 'productproject:about' %}">О компании</a>
            <a href="{% url 'productproject:plate_list' %}">Товары</a>
            <a href="{% url 'productproject:artist_list' %}">Исполнители</a>
            <a href="{% url 'productproject:cart' %}">Корзина</a>
        </nav>
    </header>

    <div class="hero">
        <h1>VINYL STORE</h1>
        <p>Настоящий винил для настоящих ценителей</p>
        <a href="{% url 'productproject:plate_list' %}" class="btn">Открыть каталог</a>
    </div>

    <footer>
        © 2026 VINYL STORE — Все права защищены
    </footer>
</body>
</html>
